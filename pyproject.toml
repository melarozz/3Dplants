[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-cpd"
version = "0.4.1"
description = "3D plant phenotyping: segmentation, CPD registration, growth tracking, lighting, morphometrics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

authors = [
    {name = "Iakovleva V.V."},
]

keywords = ["3d", "phenotyping", "plants", "cpd", "point-cloud", "morphometrics"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "trimesh[easy]>=4.0",
    "pycpd>=2.0",
    "h5py>=3.10",
    "pyvista>=0.43",
    "matplotlib>=3.8",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]
generation = [
    "rembg>=2.0",
    "onnxruntime>=1.16",
    "Pillow>=10.0",
]

[project.scripts]
plant-cpd = "plant_3d.infrastructure.cpd.cli:main"
plant-light = "plant_3d.infrastructure.light.cli.main:main"
plant-segment = "plant_3d.infrastructure.segmentation.cli.segment:main"
plant3d = "plant_3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["plant_3d*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
