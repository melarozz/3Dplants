[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-cpd"
version = "0.1.0"
description = "CPD-based registration of 3D plant models (GLB)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Plant CPD Team"},
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "trimesh[easy]>=4.0",
    "pycpd>=2.0",
    "h5py>=3.10",
    "pyvista>=0.43",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
plant-cpd = "plant_cpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"